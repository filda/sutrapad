name: Daily Mutation Testing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: true

jobs:
  # Cheap gate so the cron-triggered run skips on quiet days. If nothing that
  # can move the mutation score landed in the last 25 hours (24 h cadence +
  # 15-min GitHub cron jitter buffer), the mutation job below skips entirely
  # instead of burning ~40 min to produce yesterday's report verbatim. Manual
  # `workflow_dispatch` always proceeds — the gate only debounces the schedule
  # trigger, and a workflow edit isn't itself score-relevant, so dispatch is
  # the way to test one.
  gate:
    name: Check for score-relevant commits
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # `git log --since` needs history; default fetch-depth: 1 sees only
          # the tip commit. fetch-depth: 0 is overkill but trivial on this
          # repo and keeps the check robust against any history shape.
          fetch-depth: 0

      - name: Determine whether mutation run is needed
        id: check
        env:
          # Only these paths can move the mutation score. A commit that touches
          # docs, the README, or another workflow produces a byte-identical
          # report, so the run isn't worth the runner time. Keep this list in
          # sync with what Stryker actually reads: the mutate scope (`src`), the
          # tests that kill mutants, its own config, the vitest config it drives
          # the runner through, the lockfile (a dependency bump can change
          # behaviour), and the tsconfigs the typescript checker compiles with.
          RELEVANT_PATHS: >-
            src tests stryker.config.mjs vitest.config.ts
            package-lock.json tsconfig.json tsconfig.vitest.json
        run: |
          # `$RELEVANT_PATHS` is deliberately unquoted: git wants each path as
          # its own pathspec argument, so word splitting is the point here.
          # Quoting it would pass the whole list as one path and match nothing,
          # which would silently skip every run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='25 hours ago' --format=%H -- $RELEVANT_PATHS)" ]; then
            echo "Score-relevant commits in the last 25 hours — running:"
            git log --since='25 hours ago' --format='  %h %s' -- $RELEVANT_PATHS
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No score-relevant commits in the last 25 hours — skipping."
            echo "Commits seen in the window (none of them score-relevant):"
            git log --since='25 hours ago' --format='  %h %s'
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Run Stryker
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || 'local-dev-client-id.apps.googleusercontent.com' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
